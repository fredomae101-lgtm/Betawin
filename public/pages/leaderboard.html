<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Betawin | Leaderboard</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at top right,#073d78,transparent 35%),
    radial-gradient(circle at bottom left,#43004f,transparent 35%),
    #070014;
}

header{
  height:68px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#090120;
  border-bottom:1px solid #25154b;
  position:sticky;
  top:0;
  z-index:20;
}

.back{
  width:42px;
  font-size:28px;
  cursor:pointer;
}

.logo{
  font-size:27px;
  font-weight:900;
  color:#00eaff;
}

.logo span{
  color:#ff22cf;
}

.profile{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ff20c8,#006eff);
  font-weight:bold;
}

main{
  max-width:900px;
  margin:auto;
  padding:22px 15px 40px;
}

.heading{
  margin-bottom:20px;
}

.heading h1{
  font-size:28px;
  margin-bottom:7px;
}

.heading p{
  color:#999;
}

.filters{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:22px;
}

.filters button{
  flex:none;
  padding:11px 17px;
  border:1px solid #302052;
  border-radius:20px;
  background:#10052c;
  color:#aaa;
  cursor:pointer;
}

.filters button.active,
.filters button:hover{
  background:linear-gradient(90deg,#ff20c8,#006eff);
  color:#fff;
  border-color:transparent;
}

.leaderboard{
  background:#10052c;
  border:1px solid #28174d;
  border-radius:18px;
  overflow:hidden;
}

.table-head,
.player{
  display:grid;
  grid-template-columns:55px 1fr 80px 80px;
  gap:10px;
  align-items:center;
}

.table-head{
  padding:14px;
  background:rgba(255,255,255,.04);
  color:#777;
  font-size:11px;
  text-transform:uppercase;
}

.player{
  padding:15px 14px;
  border-top:1px solid #21133f;
}

.rank{
  font-weight:900;
  color:#00eaff;
}

.name{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.avatar{
  width:36px;
  height:36px;
  flex:none;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ff20c8,#006eff);
  font-weight:bold;
}

.username{
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.points{
  color:#00eaff;
  font-weight:bold;
  text-align:right;
}

.position{
  text-align:right;
  color:#aaa;
}

.loading,
.empty,
.error{
  padding:35px 15px;
  text-align:center;
  color:#888;
}

.error{
  color:#ff6b9d;
}

.refresh{
  width:100%;
  margin-top:18px;
  padding:13px;
  border:1px solid #302052;
  border-radius:12px;
  background:#10052c;
  color:#00eaff;
  cursor:pointer;
}

footer{
  text-align:center;
  color:#555;
  padding:20px;
  font-size:12px;
}

@media(max-width:500px){

  .table-head,
  .player{
    grid-template-columns:42px 1fr 65px;
  }

  .table-head span:nth-child(4),
  .player .position{
    display:none;
  }
}
</style>
</head>

<body>

<header>

  <div class="back" onclick="goBack()">←</div>

  <div class="logo">
    Beta<span>win</span>
  </div>

  <div class="profile" id="profile">U</div>

</header>


<main>

  <section class="heading">
    <h1>Leaderboard 🏆</h1>
    <p>View current rankings and performance.</p>
  </section>


  <div class="filters">

    <button
      class="active"
      onclick="setFilter('all',this)">
      All
    </button>

    <button
      onclick="setFilter('football',this)">
      ⚽ Football
    </button>

    <button
      onclick="setFilter('basketball',this)">
      🏀 Basketball
    </button>

    <button
      onclick="setFilter('tennis',this)">
      🎾 Tennis
    </button>

  </div>


  <section class="leaderboard">

    <div class="table-head">
      <span>Rank</span>
      <span>Player</span>
      <span>Points</span>
      <span>Position</span>
    </div>

    <div id="players">

      <div class="loading">
        Loading leaderboard...
      </div>

    </div>

  </section>


  <button
    class="refresh"
    onclick="loadLeaderboard()">
    ↻ Refresh Leaderboard
  </button>

</main>


<footer>
  © 2026 Betawin
</footer>


<script>

const token =
  localStorage.getItem("token");

if(!token){
  window.location.href="/";
}


/* USER */

try{

  const user =
    JSON.parse(
      localStorage.getItem("user")
    );

  if(user && user.name){

    document.getElementById("profile")
      .textContent =
      user.name
      .charAt(0)
      .toUpperCase();

  }

}catch(error){

  console.log(
    "User data unavailable"
  );

}


/* STATE */

let players = [];

let currentFilter = "all";


/* BACK */

function goBack(){

  window.location.href =
    "/dashboard.html";

}


/* LOAD BACKEND DATA */

async function loadLeaderboard(){

  const container =
    document.getElementById("players");

  container.innerHTML = `
    <div class="loading">
      Loading leaderboard...
    </div>
  `;

  try{

    const response =
      await fetch(
        "/api/leaderboard",
        {
          method:"GET",
          headers:{
            "Authorization":
              `Bearer ${token}`,
            "Content-Type":
              "application/json"
          }
        }
      );


    if(response.status === 401){

      localStorage.removeItem("token");
      localStorage.removeItem("user");

      window.location.href="/";

      return;

    }


    if(!response.ok){

      throw new Error(
        "HTTP " + response.status
      );

    }


    const data =
      await response.json();


    players =
      Array.isArray(data.players)
      ? data.players
      : Array.isArray(data.leaderboard)
      ? data.leaderboard
      : [];


    renderLeaderboard();


  }catch(error){

    console.error(
      "LEADERBOARD API ERROR:",
      error
    );

    container.innerHTML = `
      <div class="error">
        Unable to load leaderboard.
        <br><br>
        Please try again.
      </div>
    `;

  }

}


/* FILTER */

function setFilter(
  filter,
  button
){

  currentFilter = filter;

  document
    .querySelectorAll(".filters button")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  renderLeaderboard();

}


/* RENDER */

function renderLeaderboard(){

  const container =
    document.getElementById("players");


  let list = players;


  if(currentFilter !== "all"){

    list =
      players.filter(player =>
        String(
          player.sport || ""
        ).toLowerCase()
        === currentFilter
      );

  }


  if(!list.length){

    container.innerHTML = `
      <div class="empty">
        No leaderboard data available.
      </div>
    `;

    return;

  }


  container.innerHTML =
    list.map((player,index) => {

      const rank =
        player.rank ??
        index + 1;

      const name =
        escapeHTML(
          player.name ||
          player.username ||
          "Player"
        );

      const points =
        player.points ??
        player.score ??
        0;

      const position =
        escapeHTML(
          player.position ||
          player.sport ||
          "-"
        );


      return `

        <div class="player">

          <div class="rank">
            #${rank}
          </div>


          <div class="name">

            <div class="avatar">
              ${name.charAt(0).toUpperCase()}
            </div>

            <span class="username">
              ${name}
            </span>

          </div>


          <div class="points">
            ${points}
          </div>


          <div class="position">
            ${position}
          </div>

        </div>

      `;

    }).join("");

}


/* SECURITY */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* INITIAL REQUEST */

loadLeaderboard();

</script>

</body>
</html>
