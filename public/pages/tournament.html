<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Betawin | Tournaments</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at top right,#073d78,transparent 35%),
    radial-gradient(circle at bottom left,#43004f,transparent 35%),
    #070014;
}

header{
  height:68px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#090120;
  border-bottom:1px solid #25154b;
  position:sticky;
  top:0;
  z-index:20;
}

.back{
  width:42px;
  font-size:28px;
  cursor:pointer;
}

.logo{
  font-size:27px;
  font-weight:900;
  color:#00eaff;
}

.logo span{
  color:#ff22cf;
}

.profile{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ff20c8,#006eff);
  font-weight:bold;
}

main{
  max-width:1100px;
  margin:auto;
  padding:22px 15px 40px;
}

.heading{
  margin-bottom:20px;
}

.heading h1{
  font-size:28px;
  margin-bottom:7px;
}

.heading p{
  color:#999;
}

.filters{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:22px;
}

.filters button{
  flex:none;
  padding:11px 17px;
  border:1px solid #302052;
  border-radius:20px;
  background:#10052c;
  color:#aaa;
  cursor:pointer;
}

.filters button.active,
.filters button:hover{
  background:linear-gradient(90deg,#ff20c8,#006eff);
  color:#fff;
  border-color:transparent;
}

.tournaments{
  display:grid;
  grid-template-columns:1fr;
  gap:14px;
}

.tournament{
  padding:20px;
  border-radius:18px;
  background:#10052c;
  border:1px solid #28174d;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.icon{
  width:48px;
  height:48px;
  border-radius:14px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#281050,#071f54);
  font-size:25px;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  background:rgba(0,234,255,.08);
  color:#00eaff;
  font-size:11px;
  font-weight:bold;
}

.tournament h2{
  font-size:19px;
  margin-bottom:7px;
}

.description{
  color:#888;
  font-size:13px;
  margin-bottom:16px;
}

.info{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:16px;
}

.info div{
  padding:10px 5px;
  text-align:center;
  border-radius:10px;
  background:rgba(255,255,255,.045);
}

.info small{
  display:block;
  color:#666;
  margin-bottom:5px;
  font-size:10px;
}

.info strong{
  font-size:12px;
}

.view{
  width:100%;
  padding:12px;
  border:0;
  border-radius:11px;
  background:linear-gradient(90deg,#ff20c8,#006eff);
  color:#fff;
  font-weight:bold;
  cursor:pointer;
}

.loading,
.empty,
.error{
  text-align:center;
  padding:35px 15px;
  color:#888;
  grid-column:1/-1;
}

.error{
  color:#ff6b9d;
}

.refresh{
  width:100%;
  margin-top:18px;
  padding:13px;
  border:1px solid #302052;
  border-radius:12px;
  background:#10052c;
  color:#00eaff;
  cursor:pointer;
}

footer{
  text-align:center;
  color:#555;
  padding:20px;
  font-size:12px;
}

@media(min-width:650px){
  .tournaments{
    grid-template-columns:repeat(2,1fr);
  }
}
</style>
</head>

<body>

<header>

  <div class="back" onclick="goBack()">←</div>

  <div class="logo">
    Beta<span>win</span>
  </div>

  <div class="profile" id="profile">U</div>

</header>


<main>

  <section class="heading">
    <h1>Tournaments 🏆</h1>
    <p>Live and upcoming competitions.</p>
  </section>


  <div class="filters">

    <button
      class="active"
      data-filter="all"
      onclick="setFilter('all',this)">
      All
    </button>

    <button
      data-filter="football"
      onclick="setFilter('football',this)">
      ⚽ Football
    </button>

    <button
      data-filter="basketball"
      onclick="setFilter('basketball',this)">
      🏀 Basketball
    </button>

    <button
      data-filter="tennis"
      onclick="setFilter('tennis',this)">
      🎾 Tennis
    </button>

    <button
      data-filter="upcoming"
      onclick="setFilter('upcoming',this)">
      Upcoming
    </button>

  </div>


  <section
    class="tournaments"
    id="tournaments">

    <div class="loading">
      Loading tournaments...
    </div>

  </section>


  <button
    class="refresh"
    onclick="loadTournaments()">
    ↻ Refresh
  </button>

</main>


<footer>
  © 2026 Betawin
</footer>


<script>

const token = localStorage.getItem("token");

if(!token){
  window.location.href="/";
}


/* USER */

try{

  const user =
    JSON.parse(
      localStorage.getItem("user")
    );

  if(user && user.name){

    document.getElementById("profile")
      .textContent =
      user.name
      .charAt(0)
      .toUpperCase();

  }

}catch(error){

  console.log("User data unavailable");

}


/* NAVIGATION */

function goBack(){

  window.location.href="/dashboard.html";

}


/* STATE */

let tournaments = [];

let currentFilter = "all";


/* LOAD FROM BACKEND */

async function loadTournaments(){

  const container =
    document.getElementById("tournaments");

  container.innerHTML = `
    <div class="loading">
      Loading tournaments...
    </div>
  `;

  try{

    const response = await fetch(
      "/api/tournaments",
      {
        method:"GET",
        headers:{
          "Authorization":
            `Bearer ${token}`,
          "Content-Type":
            "application/json"
        }
      }
    );


    if(response.status === 401){

      localStorage.removeItem("token");
      localStorage.removeItem("user");

      window.location.href="/";

      return;

    }


    if(!response.ok){

      throw new Error(
        "Backend returned " +
        response.status
      );

    }


    const data =
      await response.json();


    /*
      Backend can return:

      {
        "tournaments":[]
      }
    */

    tournaments =
      Array.isArray(data.tournaments)
      ? data.tournaments
      : [];


    renderTournaments();


  }catch(error){

    console.error(
      "TOURNAMENT API ERROR:",
      error
    );

    container.innerHTML = `
      <div class="error">
        Unable to load tournaments.
        <br><br>
        Please try again.
      </div>
    `;

  }

}


/* FILTER */

function setFilter(
  filter,
  button
){

  currentFilter = filter;

  document
    .querySelectorAll(".filters button")
    .forEach(btn =>
      btn.classList.remove("active")
    );

  button.classList.add("active");

  renderTournaments();

}


/* RENDER BACKEND DATA */

function renderTournaments(){

  const container =
    document.getElementById("tournaments");


  let list = tournaments;


  if(currentFilter !== "all"){

    list = tournaments.filter(item => {

      const sport =
        String(
          item.sport || ""
        ).toLowerCase();

      const status =
        String(
          item.status || ""
        ).toLowerCase();

      if(currentFilter === "upcoming"){

        return (
          status === "upcoming" ||
          status === "scheduled"
        );

      }

      return sport === currentFilter;

    });

  }


  if(!list.length){

    container.innerHTML = `
      <div class="empty">
        No tournaments available.
      </div>
    `;

    return;

  }


  container.innerHTML =
    list.map(tournament => {

      const id =
        escapeHTML(
          tournament._id ||
          tournament.id ||
          ""
        );

      const name =
        escapeHTML(
          tournament.name ||
          "Tournament"
        );

      const sport =
        escapeHTML(
          tournament.sport ||
          "Sports"
        );

      const status =
        escapeHTML(
          tournament.status ||
          "Upcoming"
        );

      const description =
        escapeHTML(
          tournament.description ||
          "Tournament competition"
        );

      const teams =
        tournament.teams ??
        tournament.participants ??
        "-";

      const matches =
        tournament.matches ??
        "-";

      const date =
        escapeHTML(
          tournament.startDate ||
          tournament.date ||
          "-"
        );


      return `

        <article
          class="tournament">

          <div class="top">

            <div class="icon">
              ${getSportIcon(sport)}
            </div>

            <span class="status">
              ${status}
            </span>

          </div>


          <h2>
            ${name}
          </h2>


          <p class="description">
            ${description}
          </p>


          <div class="info">

            <div>
              <small>Teams</small>
              <strong>${teams}</strong>
            </div>

            <div>
              <small>Matches</small>
              <strong>${matches}</strong>
            </div>

            <div>
              <small>Start</small>
              <strong>${date}</strong>
            </div>

          </div>


          <button
            class="view"
            onclick="openTournament('${id}')">

            VIEW TOURNAMENT

          </button>

        </article>

      `;

    }).join("");

}


/* TOURNAMENT DETAILS */

function openTournament(id){

  if(!id){

    return;

  }

  window.location.href =
    "/pages/tournament.html?id=" +
    encodeURIComponent(id);

}


/* SPORT ICON */

function getSportIcon(sport){

  const value =
    String(sport)
      .toLowerCase();

  if(value.includes("football"))
    return "⚽";

  if(value.includes("basketball"))
    return "🏀";

  if(value.includes("tennis"))
    return "🎾";

  if(value.includes("volleyball"))
    return "🏐";

  return "🏆";

}


/* SAFE HTML */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


/* INITIAL REQUEST */

loadTournaments();

</script>

</body>
  </html>
