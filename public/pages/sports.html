<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Betawin | Sports</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif;
}

body{
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at top right,#073c78,transparent 35%),
    radial-gradient(circle at bottom left,#43004d,transparent 35%),
    #070014;
}

header{
  height:68px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#090120;
  border-bottom:1px solid #25154b;
  position:sticky;
  top:0;
  z-index:10;
}

.back{
  font-size:28px;
  cursor:pointer;
}

.logo{
  font-size:27px;
  font-weight:900;
  color:#00eaff;
}

.logo span{
  color:#ff22cf;
}

.profile{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ff20c8,#006eff);
  font-weight:bold;
}

main{
  max-width:1100px;
  margin:auto;
  padding:22px 15px 40px;
}

.heading{
  margin-bottom:20px;
}

.heading h1{
  font-size:28px;
  margin-bottom:7px;
}

.heading p{
  color:#999;
}

.categories{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:24px;
}

.categories button{
  flex:none;
  padding:11px 17px;
  border:1px solid #302052;
  border-radius:20px;
  background:#10052c;
  color:#aaa;
  cursor:pointer;
}

.categories button.active,
.categories button:hover{
  background:linear-gradient(90deg,#ff20c8,#006eff);
  color:#fff;
  border-color:transparent;
}

.section-title{
  margin:23px 0 13px;
  font-size:20px;
}

.sports-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.sport{
  padding:20px 12px;
  text-align:center;
  border-radius:17px;
  background:#10052c;
  border:1px solid #27164b;
  cursor:pointer;
  transition:.2s;
}

.sport:hover{
  transform:translateY(-3px);
  border-color:#00eaff;
}

.sport .icon{
  font-size:34px;
  margin-bottom:9px;
}

.events{
  display:grid;
  gap:11px;
}

.event{
  padding:17px;
  border-radius:15px;
  background:#10052c;
  border:1px solid #25164a;
}

.event-top{
  display:flex;
  justify-content:space-between;
  color:#888;
  font-size:12px;
  margin-bottom:12px;
}

.live{
  color:#ff38ae;
  font-weight:bold;
}

.teams{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.team{
  flex:1;
}

.team:last-child{
  text-align:right;
}

.vs{
  color:#00eaff;
  font-weight:bold;
}

.status{
  margin-top:12px;
  color:#888;
  font-size:12px;
}

.loading,
.empty{
  text-align:center;
  padding:25px;
  color:#888;
}

footer{
  text-align:center;
  color:#555;
  font-size:12px;
  padding:20px;
}

@media(min-width:650px){
  .sports-grid{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<header>

  <div class="back" onclick="goBack()">←</div>

  <div class="logo">
    Beta<span>win</span>
  </div>

  <div class="profile" id="profile">U</div>

</header>


<main>

  <section class="heading">
    <h1>Sports ⚽</h1>
    <p>Explore sports, competitions and upcoming events.</p>
  </section>


  <!-- SPORT FILTERS -->
  <div class="categories">

    <button class="active" onclick="filterSport('all',this)">
      All
    </button>

    <button onclick="filterSport('football',this)">
      ⚽ Football
    </button>

    <button onclick="filterSport('basketball',this)">
      🏀 Basketball
    </button>

    <button onclick="filterSport('tennis',this)">
      🎾 Tennis
    </button>

    <button onclick="filterSport('volleyball',this)">
      🏐 Volleyball
    </button>

  </div>


  <!-- SPORTS -->
  <h2 class="section-title">Sports</h2>

  <section class="sports-grid">

    <div class="sport" data-sport="football">
      <div class="icon">⚽</div>
      <strong>Football</strong>
    </div>

    <div class="sport" data-sport="basketball">
      <div class="icon">🏀</div>
      <strong>Basketball</strong>
    </div>

    <div class="sport" data-sport="tennis">
      <div class="icon">🎾</div>
      <strong>Tennis</strong>
    </div>

    <div class="sport" data-sport="volleyball">
      <div class="icon">🏐</div>
      <strong>Volleyball</strong>
    </div>

  </section>


  <!-- EVENTS -->
  <h2 class="section-title">Upcoming & Live Events</h2>

  <section class="events" id="events">

    <div class="loading">
      Loading events...
    </div>

  </section>

</main>


<footer>
  © 2026 Betawin
</footer>


<script>

const token = localStorage.getItem("token");

if(!token){
  window.location.href="/";
}


/* NAVIGATION */
function goBack(){
  window.location.href="/dashboard.html";
}


/* USER */
try{

  const user =
    JSON.parse(localStorage.getItem("user"));

  if(user && user.name){

    document.getElementById("profile")
      .textContent =
      user.name.charAt(0).toUpperCase();

  }

}catch(error){
  console.log("User data unavailable");
}


/* SPORT FILTER */
function filterSport(type,button){

  document
    .querySelectorAll(".categories button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  document
    .querySelectorAll(".sport")
    .forEach(card => {

      if(type === "all" ||
         card.dataset.sport === type){

        card.style.display="block";

      }else{

        card.style.display="none";

      }

    });

}


/* LOAD EVENTS FROM BACKEND */
async function loadEvents(){

  const container =
    document.getElementById("events");

  try{

    const response = await fetch(
      "/api/sports/events",
      {
        headers:{
          Authorization:`Bearer ${token}`
        }
      }
    );

    if(!response.ok){
      throw new Error("Failed to load events");
    }

    const data = await response.json();

    const events = data.events || [];

    if(!events.length){

      container.innerHTML =
        `<div class="empty">
          No events available right now.
        </div>`;

      return;
    }

    container.innerHTML = events.map(event => `

      <article class="event">

        <div class="event-top">

          <span>
            ${event.sport || "Sports"}
          </span>

          <span class="${event.live ? "live" : ""}">
            ${event.live ? "● LIVE" : event.time || ""}
          </span>

        </div>

        <div class="teams">

          <div class="team">
            ${event.home || "Home"}
          </div>

          <div class="vs">
            VS
          </div>

          <div class="team">
            ${event.away || "Away"}
          </div>

        </div>

        <div class="status">
          ${event.status || "Upcoming event"}
        </div>

      </article>

    `).join("");

  }catch(error){

    console.error(error);

    container.innerHTML = `
      <div class="empty">
        Sports events are currently unavailable.
      </div>
    `;
  }

}


/* START */
loadEvents();

</script>

</body>
</html>
