<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Betawin | Live Scores</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,sans-serif
}

body{
  min-height:100vh;
  color:#fff;
  background:
    radial-gradient(circle at top right,#073d78,transparent 35%),
    radial-gradient(circle at bottom left,#43004f,transparent 35%),
    #070014
}

header{
  height:68px;
  padding:0 16px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  background:#090120;
  border-bottom:1px solid #25154b;
  position:sticky;
  top:0;
  z-index:10
}

.back{
  font-size:28px;
  cursor:pointer;
  width:42px
}

.logo{
  font-size:27px;
  font-weight:900;
  color:#00eaff
}

.logo span{
  color:#ff22cf
}

.profile{
  width:38px;
  height:38px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#ff20c8,#006eff);
  font-weight:bold
}

main{
  max-width:1100px;
  margin:auto;
  padding:22px 15px 40px
}

.heading{
  margin-bottom:20px
}

.heading h1{
  font-size:28px;
  margin-bottom:7px
}

.heading p{
  color:#999
}

.filters{
  display:flex;
  gap:9px;
  overflow-x:auto;
  padding-bottom:5px;
  margin-bottom:22px
}

.filters button{
  flex:none;
  padding:11px 17px;
  border:1px solid #302052;
  border-radius:20px;
  background:#10052c;
  color:#aaa;
  cursor:pointer
}

.filters button.active,
.filters button:hover{
  background:linear-gradient(90deg,#ff20c8,#006eff);
  color:#fff;
  border-color:transparent
}

.live-status{
  display:flex;
  align-items:center;
  gap:8px;
  color:#ff3cae;
  font-size:13px;
  font-weight:bold;
  margin-bottom:15px
}

.dot{
  width:9px;
  height:9px;
  border-radius:50%;
  background:#ff2c91;
  box-shadow:0 0 12px #ff2c91;
  animation:pulse 1.2s infinite
}

@keyframes pulse{
  50%{opacity:.3;transform:scale(.7)}
}

.scores{
  display:grid;
  gap:12px
}

.score-card{
  background:#10052c;
  border:1px solid #28174c;
  border-radius:17px;
  overflow:hidden
}

.card-top{
  padding:12px 15px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  background:rgba(255,255,255,.035);
  border-bottom:1px solid #21123e;
  font-size:12px;
  color:#888
}

.live{
  color:#ff36ac;
  font-weight:bold
}

.card-body{
  padding:18px 15px
}

.league{
  color:#00eaff;
  font-size:12px;
  margin-bottom:14px
}

.teams{
  display:grid;
  grid-template-columns:1fr 70px 1fr;
  align-items:center;
  gap:10px
}

.team{
  font-weight:bold
}

.team.away{
  text-align:right
}

.score{
  text-align:center;
  font-size:22px;
  font-weight:900;
  color:#00eaff
}

.period{
  text-align:center;
  color:#888;
  font-size:11px;
  margin-top:4px
}

.stats{
  margin-top:15px;
  padding-top:12px;
  border-top:1px solid #21123e;
  display:flex;
  justify-content:space-between;
  color:#777;
  font-size:12px
}

.empty,
.loading{
  padding:30px;
  text-align:center;
  color:#888;
  background:#10052c;
  border-radius:16px
}

.refresh{
  width:100%;
  margin-top:18px;
  padding:14px;
  border:1px solid #302052;
  border-radius:13px;
  background:#11052e;
  color:#00eaff;
  cursor:pointer
}

.refresh:hover{
  background:#1b0b42
}

footer{
  text-align:center;
  color:#555;
  padding:20px;
  font-size:12px
}

@media(min-width:650px){
  .scores{
    grid-template-columns:repeat(2,1fr)
  }
}
</style>
</head>

<body>

<header>

  <div class="back" onclick="goBack()">←</div>

  <div class="logo">
    Beta<span>win</span>
  </div>

  <div class="profile" id="profile">U</div>

</header>


<main>

  <section class="heading">
    <h1>Live Scores 🔴</h1>
    <p>Follow live scores and match updates.</p>
  </section>


  <div class="filters">

    <button class="active" onclick="filterScores('all',this)">
      All
    </button>

    <button onclick="filterScores('football',this)">
      ⚽ Football
    </button>

    <button onclick="filterScores('basketball',this)">
      🏀 Basketball
    </button>

    <button onclick="filterScores('tennis',this)">
      🎾 Tennis
    </button>

    <button onclick="filterScores('volleyball',this)">
      🏐 Volleyball
    </button>

  </div>


  <div class="live-status">
    <span class="dot"></span>
    LIVE NOW
  </div>


  <section class="scores" id="scores">

    <div class="loading">
      Loading live scores...
    </div>

  </section>


  <button class="refresh" onclick="loadScores()">
    ↻ Refresh Scores
  </button>

</main>


<footer>
  © 2026 Betawin
</footer>


<script>

const token = localStorage.getItem("token");

if(!token){
  window.location.href="/";
}


/* BACK */
function goBack(){
  window.location.href="/dashboard.html";
}


/* USER */
try{

  const user =
    JSON.parse(localStorage.getItem("user"));

  if(user && user.name){

    document.getElementById("profile")
      .textContent =
      user.name.charAt(0).toUpperCase();

  }

}catch(error){
  console.log("User data unavailable");
}


/* CURRENT FILTER */
let currentFilter = "all";


/* FILTER */
function filterScores(type,button){

  currentFilter = type;

  document
    .querySelectorAll(".filters button")
    .forEach(btn => btn.classList.remove("active"));

  button.classList.add("active");

  renderScores(window.liveScores || []);

}


/* LOAD FROM BACKEND */
async function loadScores(){

  const container =
    document.getElementById("scores");

  container.innerHTML = `
    <div class="loading">
      Loading live scores...
    </div>
  `;

  try{

    const response = await fetch(
      "/api/sports/live-scores",
      {
        method:"GET",
        headers:{
          "Authorization":`Bearer ${token}`
        }
      }
    );

    if(!response.ok){
      throw new Error("Unable to load scores");
    }

    const data = await response.json();

    window.liveScores =
      Array.isArray(data.scores)
      ? data.scores
      : [];

    renderScores(window.liveScores);

  }catch(error){

    console.error("LIVE SCORES:",error);

    container.innerHTML = `
      <div class="empty">
        Live scores are currently unavailable.
      </div>
    `;

  }

}


/* RENDER */
function renderScores(scores){

  const container =
    document.getElementById("scores");

  let filtered = scores;

  if(currentFilter !== "all"){

    filtered = scores.filter(score =>
      String(score.sport || "").toLowerCase()
      === currentFilter
    );

  }

  if(!filtered.length){

    container.innerHTML = `
      <div class="empty">
        No live events available.
      </div>
    `;

    return;
  }


  container.innerHTML = filtered.map(score => `

    <article class="score-card">

      <div class="card-top">

        <span>
          ${score.league || "Live Event"}
        </span>

        <span class="live">
          ● LIVE
        </span>

      </div>

      <div class="card-body">

        <div class="league">
          ${score.sport || "Sports"}
        </div>

        <div class="teams">

          <div class="team">
            ${score.home || "Home"}
          </div>

          <div>

            <div class="score">
              ${score.homeScore ?? 0} -
              ${score.awayScore ?? 0}
            </div>

            <div class="period">
              ${score.period || score.time || "LIVE"}
            </div>

          </div>

          <div class="team away">
            ${score.away || "Away"}
          </div>

        </div>

        <div class="stats">

          <span>
            ${score.status || "In progress"}
          </span>

          <span>
            Updated ${score.updated || "now"}
          </span>

        </div>

      </div>

    </article>

  `).join("");

}


/* INITIAL LOAD */
loadScores();


/* AUTO REFRESH */
setInterval(loadScores,30000);

</script>

</body>
</html>
